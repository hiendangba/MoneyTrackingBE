name: Backend Security

on:
  pull_request:
    paths:
      - "auth-service/**"
      - "api-gateway/**"
      - "compose*.yaml"
      - "render.yaml"
      - ".github/workflows/backend-security.yml"
  push:
    branches: [main]
    paths:
      - "auth-service/**"
      - "api-gateway/**"
      - "compose*.yaml"
      - "render.yaml"
      - ".github/workflows/backend-security.yml"

permissions:
  contents: read

jobs:
  auth-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: auth-service/go.mod
          cache-dependency-path: auth-service/go.sum
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          working-directory: auth-service
      - name: Gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.24.7 ./...
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  envoy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate validation certificate
        run: |
          mkdir -p api-gateway/certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout api-gateway/certs/privkey.pem \
            -out api-gateway/certs/fullchain.pem \
            -days 1 -subj "/CN=localhost"
      - name: Build pinned Envoy image
        run: docker build -t money-tracking-envoy:ci api-gateway
      - name: Validate local Envoy config
        run: |
          docker run --rm \
            -v "$PWD/api-gateway/certs:/etc/envoy/certs:ro" \
            -e 'CORS_ALLOWED_ORIGIN_REGEX=^https://frontend\.example$' \
            money-tracking-envoy:ci --mode validate
      - name: Validate Render Envoy config
        run: |
          docker run --rm \
            -e ENVOY_RENDER_MODE=true \
            -e PORT=10001 \
            -e AUTH_SERVICE_HOST=auth-service \
            -e AUTH_SERVICE_PORT=8080 \
            -e 'CORS_ALLOWED_ORIGIN_REGEX=^https://frontend\.example$' \
            money-tracking-envoy:ci --mode validate
