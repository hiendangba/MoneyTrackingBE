name: Backend CD

on:
  push:
    branches:
      - main
    paths:
      - "auth-service/**"
      - "email-service/**"
      - "group-service/**"
      - "transaction-service/**"
      - "api-gateway/**"
      - "compose*.yaml"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-cd.yml"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/money-tracking

jobs:
  publish-images:
    name: Publish ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: auth-service
            context: ./auth-service
          - name: email-service
            context: ./email-service
          - name: group-service
            context: ./group-service
          - name: transaction-service
            context: ./transaction-service
          - name: api-gateway
            context: .
            dockerfile: ./api-gateway/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile || format('{0}/Dockerfile', matrix.image.context) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy production
    runs-on: ubuntu-latest
    needs:
      - publish-images
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync deploy bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "compose.yaml,deploy/docker-compose.production.yaml"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 0

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_SHA: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
          GROUP_DATABASE_URL: ${{ secrets.GROUP_DATABASE_URL }}
          TRANSACTION_DATABASE_URL: ${{ secrets.TRANSACTION_DATABASE_URL }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USERNAME: ${{ secrets.POSTGRES_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GROUP_POSTGRES_DB: ${{ secrets.GROUP_POSTGRES_DB }}
          GROUP_POSTGRES_USERNAME: ${{ secrets.GROUP_POSTGRES_USERNAME }}
          GROUP_POSTGRES_PASSWORD: ${{ secrets.GROUP_POSTGRES_PASSWORD }}
          TRANSACTION_POSTGRES_DB: ${{ secrets.TRANSACTION_POSTGRES_DB }}
          TRANSACTION_POSTGRES_USERNAME: ${{ secrets.TRANSACTION_POSTGRES_USERNAME }}
          TRANSACTION_POSTGRES_PASSWORD: ${{ secrets.TRANSACTION_POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          RABBITMQ_USERNAME: ${{ secrets.RABBITMQ_USERNAME }}
          RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}
          JWT_KEY_ID: ${{ secrets.JWT_KEY_ID }}
          JWT_PUBLIC_KEYS: ${{ secrets.JWT_PUBLIC_KEYS }}
          JWT_REFRESH_TTL: ${{ secrets.JWT_REFRESH_TTL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
          CORS_ALLOWED_ORIGIN_REGEX: ${{ secrets.CORS_ALLOWED_ORIGIN_REGEX }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          envs: GITHUB_REPOSITORY_OWNER,GITHUB_SHA,GHCR_USERNAME,GHCR_PASSWORD,DEPLOY_PATH,AUTH_DATABASE_URL,GROUP_DATABASE_URL,TRANSACTION_DATABASE_URL,POSTGRES_DB,POSTGRES_USERNAME,POSTGRES_PASSWORD,GROUP_POSTGRES_DB,GROUP_POSTGRES_USERNAME,GROUP_POSTGRES_PASSWORD,TRANSACTION_POSTGRES_DB,TRANSACTION_POSTGRES_USERNAME,TRANSACTION_POSTGRES_PASSWORD,REDIS_PASSWORD,RABBITMQ_USERNAME,RABBITMQ_PASSWORD,JWT_KEY_ID,JWT_PUBLIC_KEYS,JWT_REFRESH_TTL,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,EMAIL_FROM,LOG_LEVEL,CORS_ALLOWED_ORIGIN_REGEX
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            mkdir -p auth-service/keys
            echo "$GHCR_PASSWORD" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export IMAGE_TAG="$GITHUB_SHA"
            export GHCR_NAMESPACE="$GITHUB_REPOSITORY_OWNER"
            docker compose -f compose.yaml -f deploy/docker-compose.production.yaml pull
            docker compose -f compose.yaml -f deploy/docker-compose.production.yaml up -d --remove-orphans
