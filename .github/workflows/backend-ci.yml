name: Backend CI

on:
  pull_request:
    paths:
      - "auth-service/**"
      - "email-service/**"
      - "group-service/**"
      - "transaction-service/**"
      - "api-gateway/**"
      - "compose*.yaml"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-cd.yml"
      - "deploy/**"
  push:
    branches:
      - main
    paths:
      - "auth-service/**"
      - "email-service/**"
      - "group-service/**"
      - "transaction-service/**"
      - "api-gateway/**"
      - "compose*.yaml"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-cd.yml"
      - "deploy/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protobuf:
    name: Protobuf checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache: false

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.72.0"

      - name: Install local protobuf plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2

      - name: Lint and regenerate protobuf
        shell: bash
        run: |
          set -euo pipefail
          for service in auth-service group-service transaction-service; do
            (
              cd "$service"
              buf lint
              buf generate
            )
          done

      - name: Verify generated protobuf is committed
        shell: bash
        run: |
          set -euo pipefail
          changes="$(git status --porcelain -- \
            auth-service/gen \
            group-service/gen \
            transaction-service/gen)"
          if [[ -n "$changes" ]]; then
            echo "Generated protobuf files are not up to date:"
            echo "$changes"
            git diff -- \
              auth-service/gen \
              group-service/gen \
              transaction-service/gen
            exit 1
          fi

  go-services:
    name: "${{ matrix.service }} checks"
    needs:
      - protobuf
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - email-service
          - group-service
          - transaction-service
          - api-gateway
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Verify go.mod and go.sum are tidy
        shell: bash
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run tests with race detector
        run: go test -race -shuffle=on ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          working-directory: ${{ matrix.service }}

      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.22.5 ./...

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  docker-build:
    name: Docker build checks
    needs:
      - protobuf
      - go-services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate CI certificates
        run: |
          mkdir -p api-gateway/certs auth-service/keys
          openssl genrsa -out auth-service/keys/jwt-private.pem 2048
          openssl rsa -in auth-service/keys/jwt-private.pem -pubout -out auth-service/keys/jwt-public.pem
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout api-gateway/certs/privkey.pem \
            -out api-gateway/certs/fullchain.pem \
            -days 1 \
            -subj "/CN=localhost"

      - name: Validate Docker Compose config
        env:
          CORS_ALLOWED_ORIGIN_REGEX: ^https://frontend\.example$
          POSTGRES_USERNAME: ci
          POSTGRES_PASSWORD: ci-postgres
          GROUP_POSTGRES_USERNAME: ci-group
          GROUP_POSTGRES_PASSWORD: ci-group-postgres
          REDIS_PASSWORD: ci-redis
          RABBITMQ_USERNAME: ci-rabbit
          RABBITMQ_PASSWORD: ci-rabbit-password
          AUTH_DATABASE_URL: postgres://ci:ci-postgres@postgres:5432/money_tracking_auth?sslmode=disable
          GROUP_DATABASE_URL: postgres://ci-group:ci-group-postgres@group-postgres:5432/money_tracking_groups?sslmode=disable
          TRANSACTION_POSTGRES_USERNAME: ci-transaction
          TRANSACTION_POSTGRES_PASSWORD: ci-transaction-postgres
          TRANSACTION_DATABASE_URL: postgres://ci-transaction:ci-transaction-postgres@transaction-postgres:5432/money_tracking_transactions?sslmode=disable
        run: docker compose -f compose.yaml config > /tmp/compose.rendered.yaml

      - name: Build application images
        run: |
          docker build -t money-tracking-auth:ci auth-service
          docker build -t money-tracking-email:ci email-service
          docker build -t money-tracking-group:ci group-service
          docker build -t money-tracking-transaction:ci transaction-service
          docker build -t money-tracking-api-gateway:ci .
