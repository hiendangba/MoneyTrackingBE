# Compatibility blueprint only. Review plans and connect existing Postgres,
# Key Value, RabbitMQ, SMTP, and secret files before applying it in Render.
services:
  - type: web
    name: money-tracking-api-gateway
    runtime: docker
    dockerContext: ./api-gateway
    dockerfilePath: ./api-gateway/Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVOY_RENDER_MODE
        value: "true"
      - key: ENVOY_LOG_LEVEL
        value: info
      - key: AUTH_SERVICE_HOST
        fromService:
          type: pserv
          name: money-tracking-auth-service
          property: host
      - key: AUTH_SERVICE_PORT
        fromService:
          type: pserv
          name: money-tracking-auth-service
          property: port
      - key: CORS_ALLOWED_ORIGIN_REGEX
        sync: false

  - type: pserv
    name: money-tracking-auth-service
    runtime: docker
    dockerContext: ./auth-service
    dockerfilePath: ./auth-service/Dockerfile
    autoDeployTrigger: checksPass
    envVars:
      - key: SERVER_HOST
        value: 0.0.0.0
      - key: SERVER_PORT
        value: "8080"
      - key: LOG_LEVEL
        value: info
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USERNAME
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSL_MODE
        value: require
      - key: REDIS_ADDR
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: JWT_PRIVATE_KEY_PATH
        value: /etc/secrets/jwt-private.pem
      - key: JWT_PUBLIC_KEY_PATH
        value: /etc/secrets/jwt-public.pem
      - key: JWT_PUBLIC_KEYS
        value: money-tracking-auth-key-2026-01=/etc/secrets/jwt-public.pem
      - key: JWT_KEY_ID
        value: money-tracking-auth-key-2026-01
      - key: JWT_ACCESS_AUDIENCE
        value: money-tracking-api
      - key: JWT_REFRESH_AUDIENCE
        value: money-tracking-refresh
      - key: JWT_ISSUER
        value: auth-service
      - key: JWT_ACCESS_TTL
        value: 5m
      - key: JWT_REFRESH_TTL
        value: 168h
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAME_SITE
        value: None
      - key: AUTH_COOKIE_DOMAIN
        value: ""
      - key: CORS_ALLOWED_ORIGIN_REGEX
        sync: false
