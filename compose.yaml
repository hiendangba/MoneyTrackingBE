name: money-tracking

services:
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: money-tracking-auth-service
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      LOG_LEVEL: info
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: money_tracking_auth
      POSTGRES_USERNAME: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_SSL_MODE: disable
      POSTGRES_MAX_CONNS: 10
      POSTGRES_MIN_CONNS: 5
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: auth.events
      RABBITMQ_EMAIL_QUEUE: auth.email.otp
      RABBITMQ_REGISTER_KEY: auth.otp.register
      RABBITMQ_RESET_KEY: auth.otp.reset
      JWT_SECRET: replace-this-with-at-least-32-characters-secret
      JWT_ISSUER: auth-service
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 168h
      AUTH_ACCESS_COOKIE_NAME: access_token
      AUTH_REFRESH_COOKIE_NAME: refresh_token
      AUTH_DEFAULT_ROLE_CODE: member
      AUTH_OTP_TTL: 5m
      AUTH_OTP_MAX_ATTEMPTS: 5
      AUTH_COOKIE_SECURE: false
      AUTH_COOKIE_SAME_SITE: None
      AUTH_COOKIE_DOMAIN: ""
    ports:
      - "8080:8080"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  email-service:
    build:
      context: ./email-service
      dockerfile: Dockerfile
    container_name: money-tracking-email-service
    env_file:
      - ./email-service/.env
    environment:
      LOG_LEVEL: info
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: auth.events
      RABBITMQ_EMAIL_QUEUE: auth.email.otp
      RABBITMQ_REGISTER_KEY: auth.otp.register
      RABBITMQ_RESET_KEY: auth.otp.reset
      RABBITMQ_PREFETCH_COUNT: 5
      RABBITMQ_RECONNECT_DELAY: 5s
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  auth-migrate:
    image: migrate/migrate
    container_name: money-tracking-auth-migrate
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:123456@postgres:5432/money_tracking_auth?sslmode=disable",
        "up",
      ]
    volumes:
      - ./auth-service/migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:alpine
    container_name: money-tracking-postgres
    environment:
      POSTGRES_DB: money_tracking_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d money_tracking_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: money-tracking-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management-alpine
    container_name: money-tracking-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: money-tracking-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
